; RoverC Pro controller (M5StickC Plus). Build:  uvx --python 3.12 platformio run
[env:stickc-plus]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stick-c
board_build.variant = m5stack_stickc_plus
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DROVER_SDA_PIN=0
    -DROVER_SCL_PIN=26
    -I../firmware/include
    -I../firmware/src
lib_deps =
    m5stack/M5Unified@0.2.25
    bblanchon/ArduinoJson@^7
