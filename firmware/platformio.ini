; Build with:  uvx --python 3.12 platformio run
; (pioarduino needs Python >= 3.10)
[env:core2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -DCORE_DEBUG_LEVEL=3
lib_deps =
    m5stack/M5Unified@0.2.25
    https://github.com/m5stack/StackChan-BSP.git#8d4d6fc
    meganetaaan/M5Stack-Avatar@0.10.0
    bblanchon/ArduinoJson@^7
